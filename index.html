    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Baldev, Software Engineer and Generative AI, with a portrait photo on a dark purple background" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Hide scroll-reveal elements before first paint so they don't flash, but only when animations are allowed.
      if ('IntersectionObserver' in window && matchMedia('(prefers-reduced-motion: no-preference)').matches)
        document.documentElement.classList.add('reveal-ready')
    </script>
  </head>

    <div id="root"></div>
